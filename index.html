const HELP = `DRIFTHOME controls

Keyboard / mouse
  WASD — move. In the helm: thrust, strafe
  Arrows — turn (on foot and in the helm)
  Space / C (or Shift) — up / down. Shift in the helm is boost
  Mouse — look. Click the view to capture the cursor
  F — toggle float / walk
  E — take the helm, unbuckle, or hold to grab a handhold
  P — Start Self-Driving
  B — show / hide collision boxes (debug)
  O — photo mode
  ? — this panel

At the helm
  W launches from the bay and lifts off the pad
  Mouse or arrows steer the nose. Shift boosts
  Land slowly on Ember's pad. Creep into the sky dock, nose first

Xbox controller (standard mapping)
  Left stick — move / fly. In the helm: throttle and strafe
  Right stick — look / steer
  RT — thrust forward (analog)
  LT — brake (analog)
  RB / LB (or D-pad up / down) — up / down
  A — toggle float / walk
  X — helm / handhold
  B — boost (helm)
  Y — Start Self-Driving
  Menu — photo mode
  View — this panel
  Stick / RT / LT — take over from Self-Driving

  Left stick moves. Drag the right side to look

const canvas = document.getElementById('c');

btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); btn.blur(); });
addEventListener('gamepadconnected', (e) => toast('Controller connected — Y: Self-Driving'));
addEventListener('gamepaddisconnected', () => toast('Controller disconnected'));
function padVal(b) { return b ? (typeof b.value === 'number' ? b.value : (b.pressed ? 1 : 0)) : 0; }
function gamepad() {
